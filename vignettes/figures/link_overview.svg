<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f6f8b"/>
    </marker>
  </defs>
  <rect width="760" height="470" fill="#ffffff"/>
  <g stroke="#1f6f8b" stroke-width="2" fill="#e4f0f4">
    <rect x="280" y="30" width="200" height="70" rx="10"/>
    <rect x="40" y="330" width="200" height="70" rx="10"/>
    <rect x="520" y="330" width="200" height="70" rx="10"/>
  </g>
  <g fill="#243137" text-anchor="middle">
    <text x="380" y="60" font-size="17" font-weight="700">NCBI</text>
    <text x="380" y="82" font-size="12">BioSample (+ SRA, BioProject)</text>
    <text x="140" y="360" font-size="17" font-weight="700">GEOME</text>
    <text x="140" y="382" font-size="12">Tissue, Sample, Event</text>
    <text x="620" y="360" font-size="17" font-weight="700">GBIF</text>
    <text x="620" y="382" font-size="12">Occurrence</text>
  </g>
  <g stroke="#1f6f8b" stroke-width="2" fill="none" marker-end="url(#ah)">
    <line x1="290" y1="102" x2="152" y2="327"/>
    <line x1="170" y1="328" x2="308" y2="103"/>
    <line x1="470" y1="102" x2="608" y2="327"/>
    <line x1="590" y1="328" x2="452" y2="103"/>
    <line x1="243" y1="352" x2="516" y2="352"/>
    <line x1="517" y1="378" x2="244" y2="378"/>
  </g>
  <g fill="#243137" font-size="12">
    <text x="208" y="200" text-anchor="end">bcid</text>
    <text x="262" y="236">sequencing record</text>
    <text x="262" y="251">(bioSample)</text>
    <text x="552" y="196">voucherURI or catalogNumber</text>
    <text x="552" y="211">(Smithsonian EZID),</text>
    <text x="552" y="226">else voucher search</text>
    <text x="512" y="224" text-anchor="end">associatedSequences</text>
    <text x="380" y="343" text-anchor="middle">voucherURI (EZID), else voucher search</text>
    <text x="380" y="396" text-anchor="middle">occurrenceID (GEOME ARK)</text>
  </g>
  <g fill="#6b7b85" font-size="12" text-anchor="middle">
    <text x="380" y="440">Each arrow reads the fetched record on its tail and fills in the ID on its head.</text>
    <text x="380" y="458">Each database is fetched at most once per sample. IDs you supplied are never replaced.</text>
  </g>
</svg>
