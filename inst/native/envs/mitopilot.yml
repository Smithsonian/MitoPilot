# MitoPilot native install: main environment. Pins mirror docker/Dockerfile.
name: mitopilot
channels:
  - conda-forge
  - bioconda
dependencies:
  - r-base=4.5.2
  - r-biocmanager
  - r-remotes
  - r-ragg
  - r-xml2
  - r-curl
  - r-openssl
  - r-rsqlite
  - r-httr2
  - r-reticulate
  - r-dplyr
  - r-stringi
  - r-readr
  - r-tidyr
  - r-processx
  - bioconductor-biostrings
  - bioconductor-rsamtools
  - bioconductor-decipher
  - bioconductor-pwalign
  - openjdk=21
  - nextflow=25.10.4
  - fastp=0.23.4
  - spades=4.1.0
  - getorganelle=1.7.7.1
  - bowtie2=2.5.4
  - bwa=0.7.19
  - samtools=1.24
  - minimap2=2.28
  - blast=2.16.0
  - parallel
  - file
  - curl
  - git
  - c-compiler
  - cxx-compiler
  - fortran-compiler
  - make
  - pkg-config
  - zlib
  - bzip2
  - xz
  - libxml2
  - libcurl
  - openssl
  - cairo
  - freetype
  - harfbuzz
  - fribidi
  - libtiff
  - libpng
  - libjpeg-turbo
